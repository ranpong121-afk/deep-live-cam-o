# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "windows-obs-virtualcam-runtime" ]
  pull_request:
    branches: [ "windows-obs-virtualcam-runtime" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies (CI-friendly)
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then
          # Create a CI requirements file that excludes GPU-only onnxruntime to allow GitHub runners to install CPU runtime
          grep -v "onnxruntime-gpu" requirements.txt > requirements-ci.txt || true
          # Install a compatible CPU build of ONNX Runtime first (select known available release)
          python -m pip install "onnxruntime==1.23.2" --progress-bar off || true
          pip install -r requirements-ci.txt
        fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Install system graphics libraries (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1-mesa libgl1-mesa-glx libx11-6
    - name: Test with pytest
      run: |
        export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
        pytest
